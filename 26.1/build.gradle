plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

group = 'com.atsukigames'
base { archivesName = 'StateLink' }
version = project.hasProperty('mod_version') ? project.mod_version : '2.2.9'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.1"

    implementation "net.fabricmc:fabric-loader:0.19.5"
    // Fabric Loader bundles MixinExtras; compile against the same API without embedding a second copy.
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.0"

    implementation "net.fabricmc.fabric-api:fabric-api:0.145.1+26.1"

    // Runtime libraries nested into the final jar
    implementation "com.zaxxer:HikariCP:5.0.1"
    implementation "com.mysql:mysql-connector-j:8.0.33"
    implementation "org.slf4j:slf4j-api:1.7.36"

    include "com.zaxxer:HikariCP:5.0.1"
    include "com.mysql:mysql-connector-j:8.0.33"
    include "org.slf4j:slf4j-api:1.7.36"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

jar {
    archiveClassifier = 'mc26.1'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}
